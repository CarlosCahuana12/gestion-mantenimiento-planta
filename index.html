<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento de Planta</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/estilos.css">
  <script>try{document.documentElement.dataset.tema=localStorage.getItem("tema-mant")||(matchMedia("(prefers-color-scheme: dark)").matches?"oscuro":"claro")}catch(e){}</script>
</head>
<body>
  <header class="cabecera">
    <div class="marca">
      <div class="marca-logo"><img src="img/logo.png" alt="Logo"></div>
      <div><strong>Mantenimiento de Planta</strong><small>Gestión de mantenimiento de planta</small></div>
    </div>
    <div class="cabecera-derecha">
      <div class="selector-persona" id="selectorPersona"></div>
      <span class="reloj" id="reloj"></span>
      <button class="btn-icono" id="btnTema" type="button" aria-label="Cambiar tema">🌙</button>
    </div>
  </header>

  <nav class="pestanas" id="pestanas" aria-label="Secciones"></nav>

  <main class="contenido" id="vista"></main>

  <footer class="pie">
    <span>Maqueta de demostración · datos de ejemplo guardados en este navegador</span>
    <button class="enlace" id="btnReiniciar" type="button">↺ Restablecer datos de ejemplo</button>
  </footer>

  <div id="capaModal"></div>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/inventario.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
